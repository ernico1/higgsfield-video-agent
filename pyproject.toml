[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "higgsfield-video-agent"
version = "0.1.0"
description = "Agent that turns a creative brief into a video with the Higgsfield API"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "higgsfield-client",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
higgsfield-agent = "higgsfield_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/higgsfield_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
